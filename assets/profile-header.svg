<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title description">
  <title id="title">cog-pr — Welcome to my GitHub</title>
  <desc id="description">A dark navy banner with cyan and violet accents, a subtle grid, and a geometric orbit illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#15112c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop stop-color="#22d3ee" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a5b4fc" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="960" height="320" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="960" height="320" fill="url(#background)"/>
    <rect width="960" height="320" fill="url(#grid)"/>
    <ellipse cx="790" cy="130" rx="265" ry="235" fill="url(#violetGlow)"/>
    <ellipse cx="120" cy="320" rx="330" ry="235" fill="url(#cyanGlow)"/>
    <rect x="48" width="864" height="2" fill="url(#neon)"/>

    <g font-family="'Segoe UI', Arial, sans-serif">
      <circle cx="57" cy="55" r="4" fill="#22d3ee"/>
      <text x="72" y="60" fill="#a5b4fc" font-size="13" font-weight="600" letter-spacing="3">WELCOME TO MY GITHUB</text>
      <text x="48" y="179" fill="#f0f6fc" font-size="104" font-weight="750" letter-spacing="-5">mawo<tspan fill="#22d3ee">.</tspan>dev</text>
      <text x="52" y="224" fill="#a5b4fc" font-size="16" letter-spacing="2">Chiba Tech / MACHINE LEARNING</text>
      <text x="910" y="288" fill="#a78bfa" font-size="12" letter-spacing="2" text-anchor="end">&lt; / &gt;</text>
    </g>

    <g transform="translate(778 145)" fill="none">
      <circle r="84" fill="#17132b" fill-opacity="0.7" stroke="#a78bfa" stroke-opacity="0.35"/>
      <circle r="68" stroke="#a78bfa" stroke-opacity="0.15" stroke-dasharray="2 8"/>
      <ellipse rx="127" ry="49" transform="rotate(-32)" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.8"/>
      <ellipse rx="127" ry="49" transform="rotate(32)" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.8"/>
      <path d="M-36-27 2-51 44-18 31 35-16 48-48 9Z M-36-27 31 35 M2-51-16 48 M44-18-48 9 M-36-27 44-18 M-48 9 31 35" stroke="url(#neon)" stroke-width="1.5" stroke-opacity="0.55"/>
      <g fill="#22d3ee">
        <circle cx="-36" cy="-27" r="4"/>
        <circle cx="44" cy="-18" r="4"/>
        <circle cx="-16" cy="48" r="4"/>
        <circle cx="-105" cy="63" r="5"/>
      </g>
      <g fill="#c4b5fd">
        <circle cx="2" cy="-51" r="4"/>
        <circle cx="31" cy="35" r="4"/>
        <circle cx="-48" cy="9" r="4"/>
        <circle cx="107" cy="64" r="5"/>
      </g>
      <path d="M103-94V-76M94-85H112" stroke="#c4b5fd" stroke-width="1.5"/>
      <path d="M-112-50V-38M-118-44H-106" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6"/>
    </g>
    <path d="M52 254H910" stroke="url(#neon)" stroke-opacity="0.25"/>
  </g>
  <rect x="0.5" y="0.5" width="959" height="319" rx="19.5" fill="none" stroke="#a78bfa" stroke-opacity="0.2"/>
</svg>
